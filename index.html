<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rede Parceiros | Login & Gestão de Comissões</title>
    <meta name="description" content="Plataforma de gestão de comissões, indicações e gamificação para técnicos e parceiros." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel Standalone CDNs (Executa direto no navegador via file://) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg-main: #0b0f19;
        --bg-card: rgba(18, 24, 38, 0.75);
        --bg-card-hover: rgba(28, 36, 56, 0.85);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(99, 102, 241, 0.3);
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --primary-glow: rgba(99, 102, 241, 0.25);
        --accent-success: #10b981;
        --accent-success-bg: rgba(16, 185, 129, 0.12);
        --accent-warning: #f59e0b;
        --accent-warning-bg: rgba(245, 158, 11, 0.12);
        --accent-danger: #ef4444;
        --accent-purple: #8b5cf6;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --text-dim: #6b7280;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        --glass-backdrop: blur(16px);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-main);
        background-image: 
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        background-attachment: fixed;
        color: var(--text-main);
        min-height: 100vh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .glass-panel {
        background: var(--bg-card);
        backdrop-filter: var(--glass-backdrop);
        -webkit-backdrop-filter: var(--glass-backdrop);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .glass-panel:hover { border-color: var(--border-highlight); }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.88rem;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--accent-purple));
        color: #ffffff;
        box-shadow: 0 4px 14px var(--primary-glow);
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
      
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
      
      .btn-success {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      }
      .btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

      .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-pending { background: var(--accent-warning-bg); color: var(--accent-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
      .badge-paid { background: var(--accent-success-bg); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.3); }
      .badge-code { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px dashed rgba(99, 102, 241, 0.4); font-family: monospace; font-size: 0.85rem; }

      .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
      .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
      .form-input, .form-select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

      .table-container { width: 100%; overflow-x: auto; }
      .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
      .custom-table th { background: rgba(15, 23, 42, 0.8); color: var(--text-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
      .custom-table td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); vertical-align: middle; }
      .custom-table tr:hover { background: rgba(255, 255, 255, 0.02); }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Icones SVG Helpers Inline
      const Icons = {
        Shield: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
        UserCheck: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>,
        ShoppingBag: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
        Trophy: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 21h8m-4-4v4M6 4h12a2 2 0 0 1 2 2v2a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V6a2 2 0 0 1 2-2z"/><path d="M4 6H2a2 2 0 0 0-2 2v2a4 4 0 0 0 4 4h2m12-12h2a2 2 0 0 1 2 2v2a4 4 0 0 1-4 4h-2"/></svg>,
        FileText: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
        Lock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
        UserPlus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>,
        Copy: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
        LayoutDashboard: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>,
        LogOut: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      };

      // Dados Iniciais
      const DEFAULT_TECNICOS = [
        { id: 'tec_1', nome: 'João Silva', email: 'joao.tecnico@email.com', codigo: 'JOAO01', comissaoPorcentagem: 10, whatsapp: '(11) 98888-7777', status: 'ativo' },
        { id: 'tec_2', nome: 'Carlos Oliveira', email: 'carlos.tech@email.com', codigo: 'CARLOS02', comissaoPorcentagem: 12, whatsapp: '(21) 97777-6666', status: 'ativo' },
        { id: 'tec_3', nome: 'Mariana Costa', email: 'mariana.rep@email.com', codigo: 'MARI03', comissaoPorcentagem: 15, whatsapp: '(31) 99999-5555', status: 'ativo' }
      ];

      const DEFAULT_VENDAS = [
        { id: 'venda_1', tecnicoCodigo: 'JOAO01', tecnicoNome: 'João Silva', cliente: 'Assistência FastFix', produto: 'Curso Manutenção Avançada', valor: 1500, comissaoValor: 150, status: 'pago', data: '2026-07-20T14:30:00Z' },
        { id: 'venda_2', tecnicoCodigo: 'JOAO01', tecnicoNome: 'João Silva', cliente: 'Marcos Refrigeração', produto: 'Serviço Inversor Industrial', valor: 2800, comissaoValor: 280, status: 'pendente', data: '2026-07-24T10:15:00Z' },
        { id: 'venda_3', tecnicoCodigo: 'CARLOS02', tecnicoNome: 'Carlos Oliveira', cliente: 'Laboratório Alpha', produto: 'Equipamento Osciloscópio', valor: 4500, comissaoValor: 540, status: 'pago', data: '2026-07-22T16:45:00Z' }
      ];

      function getStoreData(key, fallback) {
        try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : fallback; } catch(e) { return fallback; }
      }
      function setStoreData(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      }

      function RedeParceirosApp() {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [userRole, setUserRole] = useState(null); // 'admin' | 'tecnico'
        const [loginTab, setLoginTab] = useState('admin'); // 'admin' | 'tecnico' | 'cadastrar'
        
        const [adminTab, setAdminTab] = useState('overview');
        const [tecnicos, setTecnicos] = useState(() => getStoreData('rede_tecnicos', DEFAULT_TECNICOS));
        const [vendas, setVendas] = useState(() => getStoreData('rede_vendas', DEFAULT_VENDAS));
        const [currentTecnico, setCurrentTecnico] = useState(tecnicos[0]);
        const [toast, setToast] = useState(null);

        // Inputs Login
        const [loginEmail, setLoginEmail] = useState('admin@redeparceiros.com');
        const [loginSenha, setLoginSenha] = useState('admin123');
        const [loginCodigoTec, setLoginCodigoTec] = useState('');

        // Inputs Cadastro Novo Técnico pelo Admin na Tela de Cadastro
        const [cadNome, setCadNome] = useState('');
        const [cadEmail, setCadEmail] = useState('');
        const [cadCodigo, setCadCodigo] = useState('');
        const [cadComissao, setCadComissao] = useState(10);
        const [cadWhatsapp, setCadWhatsapp] = useState('');

        // Inputs Nova Venda
        const [vendaTecnico, setVendaTecnico] = useState(tecnicos[0]?.codigo || 'JOAO01');
        const [vendaCliente, setVendaCliente] = useState('');
        const [vendaProduto, setVendaProduto] = useState('');
        const [vendaValor, setVendaValor] = useState('');
        const [vendaStatus, setVendaStatus] = useState('pendente');

        const showToastMsg = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(null), 3500);
        };

        const handleLoginAdmin = (e) => {
          e.preventDefault();
          setIsLoggedIn(true);
          setUserRole('admin');
          showToastMsg('Bem-vindo ao Painel do Administrador!');
        };

        const handleLoginTecnico = (e) => {
          e.preventDefault();
          const tec = tecnicos.find(t => t.codigo.toUpperCase() === loginCodigoTec.trim().toUpperCase());
          if (tec) {
            setCurrentTecnico(tec);
            setIsLoggedIn(true);
            setUserRole('tecnico');
            showToastMsg(`Bem-vindo, Técnico ${tec.nome}!`);
          } else {
            showToastMsg(`Código "${loginCodigoTec}" não encontrado.`);
          }
        };

        const handleCadastrarTecnico = (e) => {
          e.preventDefault();
          const codClean = cadCodigo.toUpperCase().trim();
          if (tecnicos.some(t => t.codigo === codClean)) {
            showToastMsg(`Código ${codClean} já cadastrado!`);
            return;
          }

          const novo = {
            id: `tec_${Date.now()}`,
            nome: cadNome,
            email: cadEmail,
            codigo: codClean,
            comissaoPorcentagem: Number(cadComissao) || 10,
            whatsapp: cadWhatsapp,
            status: 'ativo'
          };

          const atualizados = [novo, ...tecnicos];
          setTecnicos(atualizados);
          setStoreData('rede_tecnicos', atualizados);
          showToastMsg(`Técnico ${novo.nome} (${novo.codigo}) cadastrado com sucesso!`);
          setCadNome(''); setCadEmail(''); setCadCodigo(''); setCadWhatsapp('');
        };

        const handleSalvarVenda = (e) => {
          e.preventDefault();
          const tec = tecnicos.find(t => t.codigo === vendaTecnico) || tecnicos[0];
          const valNum = parseFloat(vendaValor) || 0;
          const comValor = Number((valNum * (tec.comissaoPorcentagem / 100)).toFixed(2));
          
          const nova = {
            id: `venda_${Date.now()}`,
            tecnicoCodigo: tec.codigo,
            tecnicoNome: tec.nome,
            cliente: vendaCliente,
            produto: vendaProduto,
            valor: valNum,
            comissaoValor: comValor,
            status: vendaStatus,
            data: new Date().toISOString()
          };

          const atualizadas = [nova, ...vendas];
          setVendas(atualizadas);
          setStoreData('rede_vendas', atualizadas);
          showToastMsg(`Venda registrada! Comissão de R$ ${comValor} para ${tec.nome}.`);
          setVendaCliente(''); setVendaProduto(''); setVendaValor('');
        };

        const handleAlternarStatusVenda = (vendaId) => {
          const atualizadas = vendas.map(v => v.id === vendaId ? { ...v, status: v.status === 'pago' ? 'pendente' : 'pago' } : v);
          setVendas(atualizadas);
          setStoreData('rede_vendas', atualizadas);
          showToastMsg('Status da comissão atualizado!');
        };

        // Métricas
        const totalFaturado = vendas.reduce((acc, v) => acc + v.valor, 0);
        const totalComissoes = vendas.reduce((acc, v) => acc + v.comissaoValor, 0);
        const comissoesPendentes = vendas.filter(v => v.status === 'pendente').reduce((acc, v) => acc + v.comissaoValor, 0);
        const comissoesPagas = vendas.filter(v => v.status === 'pago').reduce((acc, v) => acc + v.comissaoValor, 0);

        const minhasVendas = vendas.filter(v => v.tecnicoCodigo === currentTecnico.codigo);
        const tecComissaoPendente = minhasVendas.filter(v => v.status === 'pendente').reduce((acc, v) => acc + v.comissaoValor, 0);
        const tecComissaoPaga = minhasVendas.filter(v => v.status === 'pago').reduce((acc, v) => acc + v.comissaoValor, 0);

        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
            
            {/* Header */}
            <header style={{ background: 'rgba(11, 15, 25, 0.9)', borderBottom: '1px solid var(--border-color)', position: 'sticky', top: 0, zIndex: 100, backdropFilter: 'blur(16px)' }}>
              <div style={{ maxWidth: '1280px', margin: '0 auto', padding: '14px 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '16px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: 'linear-gradient(135deg, var(--primary), var(--accent-purple))', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icons.Shield />
                  </div>
                  <div>
                    <h1 style={{ fontSize: '1.2rem', fontWeight: '900', color: '#fff' }}>REDE PARCEIROS</h1>
                    <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Plataforma de Afiliados e Comissões</span>
                  </div>
                </div>

                {isLoggedIn && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <span style={{ fontSize: '0.85rem', color: '#10b981', fontWeight: '700' }}>
                      {userRole === 'admin' ? '👑 Administrador' : `🛠️ ${currentTecnico.nome}`}
                    </span>
                    <button onClick={() => setIsLoggedIn(false)} className="btn btn-secondary btn-sm">
                      <Icons.LogOut /> Sair
                    </button>
                  </div>
                )}
              </div>
            </header>

            {/* Conteúdo Principal */}
            <main style={{ flex: 1, maxWidth: '1280px', width: '100%', margin: '0 auto', padding: '24px' }}>
              
              {!isLoggedIn ? (
                
                /* TELA DEDICADA DE LOGIN E CADASTRO */
                <div style={{ maxWidth: '480px', margin: '40px auto' }} className="animate-fade">
                  <div className="glass-panel" style={{ padding: '32px' }}>
                    <div style={{ textAlign: 'center', marginBottom: '24px' }}>
                      <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: 'linear-gradient(135deg, var(--primary), var(--accent-purple))', margin: '0 auto 12px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <Icons.Lock />
                      </div>
                      <h2 style={{ fontSize: '1.5rem', fontWeight: '800', color: '#fff' }}>Acesse sua Conta</h2>
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginTop: '4px' }}>Entre no painel administrativo ou área do técnico</p>
                    </div>

                    {/* Abas da Tela de Login */}
                    <div style={{ display: 'flex', gap: '6px', background: 'rgba(255,255,255,0.05)', padding: '4px', borderRadius: '10px', marginBottom: '20px' }}>
                      <button onClick={() => setLoginTab('admin')} className={`btn btn-sm ${loginTab === 'admin' ? 'btn-primary' : 'btn-secondary'}`} style={{ flex: 1, border: 'none' }}>
                        Admin
                      </button>
                      <button onClick={() => setLoginTab('tecnico')} className={`btn btn-sm ${loginTab === 'tecnico' ? 'btn-primary' : 'btn-secondary'}`} style={{ flex: 1, border: 'none' }}>
                        Técnico
                      </button>
                      <button onClick={() => setLoginTab('cadastrar')} className={`btn btn-sm ${loginTab === 'cadastrar' ? 'btn-primary' : 'btn-secondary'}`} style={{ flex: 1, border: 'none' }}>
                        Cadastrar
                      </button>
                    </div>

                    {loginTab === 'admin' && (
                      <form onSubmit={handleLoginAdmin}>
                        <div className="form-group">
                          <label className="form-label">E-mail do Administrador</label>
                          <input type="email" className="form-input" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Senha</label>
                          <input type="password" className="form-input" value={loginSenha} onChange={e => setLoginSenha(e.target.value)} required />
                        </div>
                        <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '12px' }}>Entrar como Admin</button>
                      </form>
                    )}

                    {loginTab === 'tecnico' && (
                      <form onSubmit={handleLoginTecnico}>
                        <div className="form-group">
                          <label className="form-label">Seu Código de Indicação (ex: JOAO01)</label>
                          <input type="text" className="form-input" placeholder="JOAO01" value={loginCodigoTec} onChange={e => setLoginCodigoTec(e.target.value.toUpperCase())} style={{ fontFamily: 'monospace', textTransform: 'uppercase', fontWeight: '700' }} required />
                        </div>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '16px' }}>
                          Dica de teste: Digite <strong>JOAO01</strong>, <strong>CARLOS02</strong> ou <strong>MARI03</strong>
                        </div>
                        <button type="submit" className="btn btn-success" style={{ width: '100%', padding: '12px' }}>Acessar Meu Painel de Técnico</button>
                      </form>
                    )}

                    {loginTab === 'cadastrar' && (
                      <form onSubmit={handleCadastrarTecnico}>
                        <div className="form-group">
                          <label className="form-label">Nome Completo do Técnico *</label>
                          <input className="form-input" placeholder="Ex: João da Silva" value={cadNome} onChange={e => { setCadNome(e.target.value); if(!cadCodigo) setCadCodigo(e.target.value.substring(0,4).toUpperCase() + '01'); }} required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Código Único (ex: JOAO01) *</label>
                          <input className="form-input" placeholder="JOAO01" value={cadCodigo} onChange={e => setCadCodigo(e.target.value.toUpperCase())} required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Comissão (% Individual) *</label>
                          <input type="number" className="form-input" value={cadComissao} onChange={e => setCadComissao(e.target.value)} required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">WhatsApp com DDD</label>
                          <input className="form-input" placeholder="(11) 99999-8888" value={cadWhatsapp} onChange={e => setCadWhatsapp(e.target.value)} />
                        </div>
                        <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '12px' }}>Cadastrar Técnico na Base</button>
                      </form>
                    )}
                  </div>
                </div>

              ) : userRole === 'admin' ? (
                
                /* PAINEL DE ADMINISTRAÇÃO (SEM ABA DE REGRAS) */
                <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
                  
                  {/* Navegação Sem a Aba de Regras */}
                  <div className="glass-panel" style={{ padding: '8px', display: 'flex', gap: '8px', overflowX: 'auto' }}>
                    <button onClick={() => setAdminTab('overview')} className={`btn btn-sm ${adminTab === 'overview' ? 'btn-primary' : 'btn-secondary'}`} style={{ border: 'none' }}>
                      <Icons.LayoutDashboard /> Visão Geral
                    </button>
                    <button onClick={() => setAdminTab('vendas')} className={`btn btn-sm ${adminTab === 'vendas' ? 'btn-primary' : 'btn-secondary'}`} style={{ border: 'none' }}>
                      <Icons.ShoppingBag /> Registrar Venda
                    </button>
                    <button onClick={() => setAdminTab('tecnicos')} className={`btn btn-sm ${adminTab === 'tecnicos' ? 'btn-primary' : 'btn-secondary'}`} style={{ border: 'none' }}>
                      <Icons.UserCheck /> Técnicos ({tecnicos.length})
                    </button>
                    <button onClick={() => setAdminTab('ranking')} className={`btn btn-sm ${adminTab === 'ranking' ? 'btn-primary' : 'btn-secondary'}`} style={{ border: 'none' }}>
                      <Icons.Trophy /> Ranking Gamificado
                    </button>
                  </div>

                  {adminTab === 'overview' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }} className="animate-fade">
                      <div className="glass-panel" style={{ padding: '24px', background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(18, 24, 38, 0.8))' }}>
                        <h2 style={{ fontSize: '1.6rem', fontWeight: '800', color: '#fff' }}>Painel Executivo da Rede de Parceiros</h2>
                        <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Acompanhe os resultados e o volume de repasses.</p>
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' }}>
                        <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #6366f1' }}>
                          <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>FATURAMENTO TOTAL</span>
                          <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#fff' }}>R$ {totalFaturado.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                        </div>

                        <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #8b5cf6' }}>
                          <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>COMISSÕES GERADAS</span>
                          <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#fff' }}>R$ {totalComissoes.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                        </div>

                        <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #f59e0b' }}>
                          <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>COMISSÃO PENDENTE</span>
                          <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#f59e0b' }}>R$ {comissoesPendentes.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                        </div>

                        <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #10b981' }}>
                          <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>COMISSÃO PAGA</span>
                          <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#10b981' }}>R$ {comissoesPagas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {adminTab === 'vendas' && (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }} className="animate-fade">
                      <div className="glass-panel" style={{ padding: '24px' }}>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: '800', marginBottom: '16px' }}>Registrar Venda Indicada</h3>
                        <form onSubmit={handleSalvarVenda}>
                          <div className="form-group">
                            <label className="form-label">Técnico Indicador *</label>
                            <select className="form-select" value={vendaTecnico} onChange={e => setVendaTecnico(e.target.value)}>
                              {tecnicos.map(t => (
                                <option key={t.id} value={t.codigo}>{t.nome} ({t.codigo}) — {t.comissaoPorcentagem}% comissão</option>
                              ))}
                            </select>
                          </div>
                          <div className="form-group">
                            <label className="form-label">Cliente Adquirente *</label>
                            <input className="form-input" placeholder="Ex: Oficina Mecânica Silva" value={vendaCliente} onChange={e => setVendaCliente(e.target.value)} required />
                          </div>
                          <div className="form-group">
                            <label className="form-label">Produto / Serviço *</label>
                            <input className="form-input" placeholder="Ex: Curso Manutenção Placas" value={vendaProduto} onChange={e => setVendaProduto(e.target.value)} required />
                          </div>
                          <div className="form-group">
                            <label className="form-label">Valor (R$) *</label>
                            <input type="number" step="0.01" className="form-input" placeholder="1500.00" value={vendaValor} onChange={e => setVendaValor(e.target.value)} required />
                          </div>
                          <button type="submit" className="btn btn-success" style={{ width: '100%', marginTop: '10px' }}>Registrar Venda & Calcular Comissão</button>
                        </form>
                      </div>

                      <div className="glass-panel" style={{ padding: '24px' }}>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: '800', marginBottom: '16px' }}>Vendas Registradas ({vendas.length})</h3>
                        <div className="table-container">
                          <table className="custom-table">
                            <thead>
                              <tr><th>Técnico</th><th>Cliente</th><th>Valor Venda</th><th>Comissão (R$)</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                              {vendas.map(v => (
                                <tr key={v.id}>
                                  <td><strong>{v.tecnicoNome}</strong><br/><span className="badge badge-code">{v.tecnicoCodigo}</span></td>
                                  <td>{v.cliente}<br/><small style={{color:'var(--text-muted)'}}>{v.produto}</small></td>
                                  <td>R$ {v.valor}</td>
                                  <td style={{color:'#10b981', fontWeight:'700'}}>R$ {v.comissaoValor}</td>
                                  <td>
                                    <button onClick={() => handleAlternarStatusVenda(v.id)} className={`badge ${v.status === 'pago' ? 'badge-paid' : 'badge-pending'}`} style={{border:'none', cursor:'pointer'}}>
                                      {v.status.toUpperCase()}
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {adminTab === 'tecnicos' && (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }} className="animate-fade">
                      <div className="glass-panel" style={{ padding: '24px' }}>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: '800', marginBottom: '16px' }}>Cadastrar Novo Técnico</h3>
                        <form onSubmit={handleCadastrarTecnico}>
                          <div className="form-group">
                            <label className="form-label">Nome Completo *</label>
                            <input className="form-input" placeholder="Ex: João Silva" value={cadNome} onChange={e => { setCadNome(e.target.value); if(!cadCodigo) setCadCodigo(e.target.value.substring(0,4).toUpperCase() + '01'); }} required />
                          </div>
                          <div className="form-group">
                            <label className="form-label">Código Único (ex: JOAO01) *</label>
                            <input className="form-input" placeholder="JOAO01" value={cadCodigo} onChange={e => setCadCodigo(e.target.value.toUpperCase())} required />
                          </div>
                          <div className="form-group">
                            <label className="form-label">Comissão (% Individual) *</label>
                            <input type="number" className="form-input" value={cadComissao} onChange={e => setCadComissao(e.target.value)} required />
                          </div>
                          <div className="form-group">
                            <label className="form-label">WhatsApp com DDD</label>
                            <input className="form-input" placeholder="(11) 99999-8888" value={cadWhatsapp} onChange={e => setCadWhatsapp(e.target.value)} />
                          </div>
                          <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '10px' }}>Cadastrar Técnico & Criar Convite</button>
                        </form>
                      </div>

                      <div className="glass-panel" style={{ padding: '24px' }}>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: '800', marginBottom: '16px' }}>Técnicos da Rede</h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                          {tecnicos.map(t => (
                            <div key={t.id} style={{ background: 'rgba(15, 23, 42, 0.6)', padding: '16px', borderRadius: '12px', border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                              <div>
                                <strong>{t.nome}</strong> <span className="badge badge-code">{t.codigo}</span>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>{t.comissaoPorcentagem}% comissão • {t.whatsapp}</div>
                              </div>
                              <button onClick={() => { navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?convite=${t.codigo}`); showToastMsg(`Link do convite ${t.codigo} copiado!`); }} className="btn btn-secondary btn-sm">
                                Copiar Convite
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {adminTab === 'ranking' && (
                    <div className="glass-panel animate-fade" style={{ padding: '24px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                        <h2 style={{ fontSize: '1.4rem', fontWeight: '800' }}>🏆 Ranking Gamificado de Parceiros</h2>
                        <button onClick={() => confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } })} className="btn btn-primary">Celebrar Campeões 🎉</button>
                      </div>
                      <div className="table-container">
                        <table className="custom-table">
                          <thead>
                            <tr><th>Posição</th><th>Técnico</th><th>Código</th><th>Total Indicado (R$)</th></tr>
                          </thead>
                          <tbody>
                            {tecnicos.map((t, idx) => {
                              const tVendas = vendas.filter(v => v.tecnicoCodigo === t.codigo);
                              const tTotal = tVendas.reduce((acc, v) => acc + v.valor, 0);
                              return (
                                <tr key={t.id}>
                                  <td style={{ fontWeight: '800' }}>{idx === 0 ? '🥇 1º' : idx === 1 ? '🥈 2º' : idx === 2 ? '🥉 3º' : `${idx + 1}º`}</td>
                                  <td><strong>{t.nome}</strong></td>
                                  <td><span className="badge badge-code">{t.codigo}</span></td>
                                  <td style={{ color: '#10b981', fontWeight: '800' }}>R$ {tTotal.toLocaleString('pt-BR')}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                </div>
              ) : (
                
                /* PAINEL RESTRITO DO TÉCNICO */
                <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }} className="animate-fade">
                  <div className="glass-panel" style={{ padding: '24px', background: 'linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(18, 24, 38, 0.8))' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
                      <div>
                        <span className="badge badge-paid">CONTA ATIVA</span>
                        <h2 style={{ fontSize: '1.8rem', fontWeight: '800', color: '#fff', marginTop: '6px' }}>Olá, {currentTecnico.nome}! 👋</h2>
                        <p style={{ color: 'var(--text-muted)' }}>Acompanhe em tempo real suas indicações e comissões.</p>
                      </div>

                      <div style={{ background: 'rgba(15, 23, 42, 0.8)', padding: '16px', borderRadius: '12px', textAlign: 'center' }}>
                        <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>SEU CÓDIGO</span>
                        <div style={{ fontSize: '1.5rem', fontWeight: '900', color: '#818cf8', fontFamily: 'monospace' }}>{currentTecnico.codigo}</div>
                        <button onClick={() => { navigator.clipboard.writeText(currentTecnico.codigo); showToastMsg('Código copiado!'); }} className="btn btn-secondary btn-sm" style={{ marginTop: '8px' }}>
                          <Icons.Copy /> Copiar Código
                        </button>
                      </div>
                    </div>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' }}>
                    <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #f59e0b' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>COMISSÃO PENDENTE</span>
                      <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#f59e0b' }}>R$ {tecComissaoPendente.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>

                    <div className="glass-panel" style={{ padding: '20px', borderLeft: '4px solid #10b981' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>COMISSÃO PAGA</span>
                      <div style={{ fontSize: '1.6rem', fontWeight: '800', color: '#10b981' }}>R$ {tecComissaoPaga.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>
                  </div>

                  <div className="glass-panel" style={{ padding: '24px' }}>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: '800', marginBottom: '16px' }}>Minhas Indicações Registradas</h3>
                    <div className="table-container">
                      <table className="custom-table">
                        <thead>
                          <tr><th>Cliente</th><th>Produto</th><th>Valor Venda</th><th>Sua Comissão</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                          {minhasVendas.map(v => (
                            <tr key={v.id}>
                              <td><strong>{v.cliente}</strong></td>
                              <td>{v.produto}</td>
                              <td>R$ {v.valor}</td>
                              <td style={{ color: '#10b981', fontWeight: '800' }}>R$ {v.comissaoValor}</td>
                              <td><span className={`badge ${v.status === 'pago' ? 'badge-paid' : 'badge-pending'}`}>{v.status.toUpperCase()}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* Toast Feedback */}
            {toast && (
              <div style={{ position: 'fixed', bottom: '24px', right: '24px', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', color: '#fff', padding: '12px 20px', borderRadius: '10px', fontWeight: '600', boxShadow: '0 10px 25px rgba(0,0,0,0.5)', zIndex: 9999 }}>
                {toast}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<RedeParceirosApp />);
    </script>
  </body>
</html>
